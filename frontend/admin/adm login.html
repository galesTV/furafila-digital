<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FuraFila Digital - Login</title>
        <link rel="stylesheet" href="css/style adm login.css">
    </head>
    <body>
        <main class="login-container">
            <img src="../images/Logo.png" alt="FuraFila Digital Logo"
                class="logo">

            <h1>LOGIN - Admin</h1>

            <form class="login-form">
                <div class="input-group">
                    <label for="escola">ID da Escola:</label>
                    <input type="text" id="escola">
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="button-row">
                    <a href="adm cadastro.html" class="btn-secondary">Não tenho
                        conta</a>
                    <button type="submit" class="btn-primary">Entrar</button>
                    <button type="button" class="btn-highlight">Entrar Como
                        Aluno</button>
                </div>
            </form>
        </main>
    </body>
</html>
