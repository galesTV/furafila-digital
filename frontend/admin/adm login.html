<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FuraFila Digital - Login</title>
        <link rel="stylesheet" href="css/style adm login.css">
    </head>

    <body>
        <main class="login-container">
            <button type="button" id="toggle-dark" class="btn-toggle">
                Alternar Modo
            </button>

            <img src="../images/Logo.png" alt="FuraFila Digital Logo"
                class="logo">

            <h1>LOGIN - Admin</h1>

            <form class="login-form">
                <div class="input-group">
                    <label for="escola">ID da Escola:</label>
                    <select id="escola" required>
                        <option value disabled selected>Selecione a
                            Escola...</option>
                        <option value="ADM001">ADM001</option>
                        <option value="ADM002">ADM002</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="button-row">
                    <div style="display: flex; gap: 15px; flex: 2;">
                        <a href="/admin/adm cadastro.html" class="btn-secondary">Não
                            tenho conta</a>
                        <button type="submit"
                            class="btn-primary">Entrar</button>
                    </div>

                    <a href="../aluno/loginaluno.html" class="btn-highlight"
                        style="flex: 1; max-width: 250px;">
                        Entrar Como Aluno
                    </a>
                </div>
            </form>
        </main>

        <script src="js/adm login.js"></script>
    </body>
</html>
