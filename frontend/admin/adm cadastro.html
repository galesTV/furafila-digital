<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuraFila Digital - Cadastro</title>
    <link rel="stylesheet" href="../admin/css/style adm cadastro.css">
</head>
<body>
    <input type="checkbox" id="dark-mode-toggle" style="display: none;">

    <main class="login-container">
        <div class="toggle-container">
            <label for="dark-mode-toggle" class="btn-toggle">Alternar Modo</label>
        </div>

        <img src="../images/Logo.png" alt="FuraFila Digital Logo" class="logo">
        <h1>CADASTRO - Admin</h1>

        <form class="register-form">
            <div class="input-group">
                <label for="escola">ID da Escola:</label>
                <input type="text" id="escola">
            </div>

            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email">
            </div>

            <div class="input-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha">
            </div>

            <div class="button-row">
                <a href="adm login.html" class="btn-secondary">Já tenho conta</a>
                <button type="submit" class="btn-primary">Cadastrar</button>
                <a href="../aluno/cadastroaluno.html" class="btn-highlight">Entrar Como Aluno</a>
            </div>
        </form>
    </main>
</body>
</html>
