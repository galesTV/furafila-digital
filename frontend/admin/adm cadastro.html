<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FuraFila Digital - Cadastro</title>
        <link rel="stylesheet" href="css/style adm cadastro.css">
    </head>

    <body>
        <main class="login-container"> <div
                style="text-align: right; width: 100%; max-width: 800px; margin-bottom: 10px;">
                <button type="button" id="toggle-dark"
                    style="cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ccc; background: #fff; font-size: 12px;">
                    Alternar Modo
                </button>
            </div>

            <img src="../images/Logo.png" alt="FuraFila Digital Logo"
                class="logo">

            <h1>CADASTRO - Admin</h1>

            <form class="register-form"> <div class="input-group">
                    <label for="escola">ID da Escola:</label>
                    <input type="text" id="escola">
                </div>

                <div class="input-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email">
                </div>

                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="button-row">
                    <div style="display: flex; gap: 15px; flex: 2;">
                        <a href="adm login.html" class="btn-secondary">Já tenho
                            conta</a>
                        <button type="submit"
                            class="btn-primary">Cadastrar</button>
                    </div>

                    <a href="../aluno/cadastroaluno.html" class="btn-highlight"
                        style="flex: 1; max-width: 250px;">
                        Entrar Como Aluno
                    </a>
                </div>
            </form>
        </main>

        <script src="js/adm cadastro.js"></script>
    </body>
</html>
