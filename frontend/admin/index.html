<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin Fullscreen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-fullscreen">
        <header class="main-header">
            <input type="text" placeholder="Pesquisar" class="search-input">
            <h2 class="admin-name">Olá, $admin</h2>
            <button class="btn-link">Entrar como Aluno</button>
        </header>

        <section class="stats-row">
            <div class="card">
                <p>Vendas diárias</p>
                <strong>10</strong>
            </div>
            <div class="card">
                <p>Vendas semanais</p>
                <strong>50</strong>
            </div>
            <div class="card">
                <p>Vendas Mensais</p>
                <strong>200</strong>
            </div>
            <div class="card">
                <p>Valor Total diário</p>
                <strong>R$237,67</strong>
            </div>
            <div class="card">
                <p>Valor Total Mensal</p>
                <strong>R$6767,67</strong>
            </div>
        </section>

        <div class="table-area">
            <table>
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Salgado</th>
                        <th>R$</th>
                        <th>Status</th>
                        <th>Atualizado</th>
                        <th>Criado</th>
                        <th>Tipo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                    <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
