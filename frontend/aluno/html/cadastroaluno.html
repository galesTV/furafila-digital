<!-- Logo e título -->

                <img src="../logo-imagens/Logo.png" alt="Logo"></a>

        <div id="lcad">
            <p>CADASTRO - Aluno</p>

        <p>Já tem uma conta? <a href="loginaluno.html">Faça login como Aluno</a></p>

    </div>
