<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Menu do Aluno - FuraFila Digital</title>
        <script src="js/auth.js"></script>
        <link rel="stylesheet" href="css/menualuno.css">
    </head>

    <body>
        <div id="master">
            <div id="topo">
                <img src="../images/logo-horizontal.png" alt="logo-horizontal">
                <input type="text" id="search-input"
                    placeholder="Pesquisar...">
                <div class="row">
                    <p>Olá, aluno</p>
                    <a href="/aluno/carrinhoaluno.html" class="btn-carrinho">Ver
                        Carrinho</a>
                    <a href="/aluno/meuspedidos.html" class="btn-meuspedidos">Meus
                        pedidos</a>
                    <a href="../admin/adm login.html"
                        class="btn-admin">Admin</a>
                    <a class="btn-logout" href="/aluno/loginaluno.html"
                        id="logout">Sair</a>
                    <button id="toggle-dark" class="btn-dark-mode">🌙</button>
                </div>
            </div>

            <div class="deitado">
                <p>Salgados</p>
                <div id="salgados-container" class="product-row"></div>
            </div>

            <div class="deitado">
                <p>Doces</p>
                <div id="doces-container" class="product-row"></div>
            </div>

            <div class="deitado">
                <p>Bebidas</p>
                <div id="bebidas-container" class="product-row"></div>
            </div>
        </div>

        <div id="modals-container"></div>

        <script src="js/menualuno.js"></script>
    </body>
</html>
