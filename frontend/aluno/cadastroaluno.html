<html lang="pt-br">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>FuraFila Digital - Cadastro</title>

        <link rel="stylesheet" href="../aluno/css/cadastroaluno.css">

    </head>

    <body>

        <classe principal="cadastro-container">

            <img src="../aluno/logo-imagens/Logo.png" alt="Logotipo"

                class="logo">



            <h1>CADASTRO - Aluno</h1>



            <form class="cadastro-form">

                <div class="input-group">

                    <label for="escola">ID da Escola:</label>

                    <input type="text" id="escola">

                </div>



                <div class="input-group">

                    <label for="email">E-mail:</label>

                    <input type="email" id="email">

                </div>



                <div class="input-group">

                    <label for="senha">Senha:</label>

                    <input type="password" id="senha">

                </div>



                <div class="button-row">

                    <a href="../aluno/loginaluno.html" class="btn-secondary">Já tenho conta</a>

                    <button type="submit" class="btn-primary">Cadastro</button>

                    <button type="button" class="btn-highlight">Entrar como administrador</button>

                </div>

            </formulário>

        </main>

    </body>

</html>
